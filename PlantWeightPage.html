<!doctype html>
<html lang="es">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--navy:#102a43;--blue:#2563eb;--line:#dbe4ee;--muted:#62748a;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#17212b;font:18px/1.4 Arial,sans-serif}header{background:linear-gradient(120deg,var(--navy),#164e63);color:#fff;padding:24px clamp(18px,4vw,48px)}header h1{margin:0;font-size:clamp(28px,5vw,42px)}header p{margin:4px 0 0;opacity:.82}main{max-width:980px;margin:auto;padding:24px 16px 56px}.toolbar,.card-top,.actions{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.toolbar{margin-bottom:18px}.stamp,.hint{color:var(--muted);font-size:14px}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:14px 20px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}button:disabled{opacity:.55}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 16px #102a430d}.card{margin-bottom:14px}.card h2{margin:0;color:var(--navy);font-size:23px}.lot{font-weight:800;color:var(--blue)}.progress{height:11px;border-radius:999px;background:#e5eaf0;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:var(--blue)}label{display:block;font-weight:800;margin:18px 0 7px}input,select,textarea{width:100%;padding:15px;border:2px solid #b9c7d5;border-radius:11px;background:#fff}textarea{min-height:78px}.actions{justify-content:flex-end;margin-top:22px}.notice{display:none;margin-bottom:16px;padding:15px;border-radius:11px;background:#fee2e2;color:#991b1b;font-weight:700}.result{border-radius:16px;padding:24px;margin-top:20px;text-align:center;font-weight:900}.result strong{display:block;font-size:42px}.result.ok{background:#dcfce7;color:#166534}.result.warn{background:#fef3c7;color:#92400e}.result.bad{background:#fee2e2;color:#991b1b;border:4px solid #dc2626}.empty{text-align:center;padding:42px;color:var(--muted)}dialog{width:min(620px,calc(100% - 20px));border:0;border-radius:18px;padding:0;box-shadow:0 20px 70px #0006}dialog::backdrop{background:#0f172a99}.dialog-body{padding:24px;max-height:94vh;overflow:auto}.dialog-body h2{margin:0 0 4px}@media(max-width:620px){body{font-size:17px}.card-top{align-items:flex-start}.card-top button{width:100%}.actions button{flex:1}}
  </style>
</head>
<body>
  <header><h1>Pesaje de piezas</h1><p>Control de peso bruto al salir del horno</p></header>
  <main>
    <div id="notice" class="notice"></div>
    <div class="toolbar"><div><strong>Órdenes abiertas</strong><div id="stamp" class="stamp">Cargando…</div></div><button class="secondary" onclick="loadOrders()">Actualizar</button></div>
    <section class="panel" style="margin-bottom:18px"><label for="operator">Operario *</label><select id="operator" required><option value="">Selecciona un operario…</option><option>Álvaro</option><option>Carlos</option><option>Emilio</option><option>Llusif</option><option>Martha</option></select></section>
    <section id="orders"><div class="empty">Cargando órdenes de fabricación…</div></section>
  </main>
  <dialog id="weightDialog"><div class="dialog-body"><h2 id="title">Pesar pieza</h2><div id="context" class="hint"></div><form onsubmit="saveWeight(event)"><input id="orderId" type="hidden"><label for="weight">Peso bruto al salir del horno (kg) *</label><input id="weight" type="number" min="0.001" step="0.001" inputmode="decimal" required><label for="notes">Observaciones</label><textarea id="notes" placeholder="Opcional"></textarea><div id="result"></div><div class="actions"><button type="button" class="secondary" onclick="closeWeight()">Cerrar</button><button id="save" class="primary" type="submit">Guardar pesaje</button></div></form></div></dialog>
  <script>
    let data=null;const el=id=>document.getElementById(id);const esc=v=>String(v==null?'':v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const num=v=>new Intl.NumberFormat('es-ES',{maximumFractionDigits:2}).format(Number(v||0));const kg=v=>new Intl.NumberFormat('es-ES',{minimumFractionDigits:3,maximumFractionDigits:3}).format(Number(v||0));
    function showError(message){el('notice').textContent=message;el('notice').style.display='block';scrollTo({top:0,behavior:'smooth'})}function clearError(){el('notice').style.display='none'}
    function loadOrders(){clearError();el('orders').innerHTML='<div class="empty">Cargando órdenes de fabricación…</div>';google.script.run.withSuccessHandler(r=>{data=r;el('stamp').textContent='Actualizado: '+r.generatedAt;render()}).withFailureHandler(e=>showError(e.message||String(e))).getPlantWeightOrders()}
    function render(){const orders=data.orders;el('orders').innerHTML=orders.length?orders.map(o=>{const pct=o.targetQuantity?Math.min(100,Math.round(o.producedQuantity/o.targetQuantity*100)):0;return `<article class="card"><div class="card-top"><div><div class="lot">${esc(o.id)} · ${esc(o.finishedLot||'Lote pendiente')}</div><h2>${esc(o.sku)} · ${esc(o.product)}</h2><div class="hint">${num(o.producedQuantity)} / ${num(o.targetQuantity)} uds · Teórico ${o.theoreticalWeight?kg(o.theoreticalWeight)+' kg':'sin definir'} · ${num(o.quality.measured)} pesajes</div></div><button class="primary" onclick="openWeight('${esc(o.id)}')">Pesar pieza</button></div><div class="progress"><span style="width:${pct}%"></span></div></article>`}).join(''):'<div class="panel empty">No hay órdenes abiertas.</div>'}
    function openWeight(id){const o=data.orders.find(item=>item.id===id);const operator=el('operator').value.trim();if(!operator)return showError('Selecciona primero el operario.');clearError();el('orderId').value=id;el('weight').value='';el('notes').value='';el('result').innerHTML='';el('title').textContent='Pesar pieza · '+id;el('context').innerHTML=`<strong>${esc(o.sku)} · ${esc(o.product)}</strong><br>Lote: ${esc(o.finishedLot||'pendiente')} · Peso teórico: ${o.theoreticalWeight?kg(o.theoreticalWeight)+' kg':'sin definir'}`;el('weightDialog').showModal();setTimeout(()=>el('weight').focus(),100)}
    function closeWeight(){el('weightDialog').close();loadOrders()}
    function saveWeight(event){event.preventDefault();const button=el('save');button.disabled=true;const input={orderId:el('orderId').value,actualWeight:el('weight').value,notes:el('notes').value,operator:el('operator').value.trim()};google.script.run.withSuccessHandler(r=>{button.disabled=false;const cls=r.result==='CONFORME'?'ok':r.result==='ALERTA'?'warn':'bad',sign=r.difference>0?'+':'';el('result').innerHTML=`<div class="result ${cls}"><span>Pieza ${num(r.pieceNumber)} · ${esc(r.result)}</span><strong>${kg(r.actualWeight)} kg</strong><div>Teórico ${kg(r.theoreticalWeight)} kg · ${sign}${kg(r.difference)} kg · ${num(r.deviationPercent)} %</div>${r.result==='NO CONFORME'?'<div style="margin-top:12px">⚠ APARTA LA PIEZA Y REVISA EL PROCESO</div>':''}</div>`;el('weight').value='';el('weight').focus()}).withFailureHandler(e=>{button.disabled=false;showError(e.message||String(e))}).recordPlantManufacturingPieceWeight(input)}
    loadOrders();
  </script>
</body>
</html>
