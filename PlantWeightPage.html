<!doctype html>
<html lang="es">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--navy:#102a43;--blue:#2563eb;--line:#dbe4ee;--muted:#62748a;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#17212b;font:18px/1.4 Arial,sans-serif}header{background:linear-gradient(120deg,var(--navy),#164e63);color:#fff;padding:24px clamp(18px,4vw,48px)}header h1{margin:0;font-size:clamp(28px,5vw,42px)}header p{margin:4px 0 0;opacity:.82}main{max-width:980px;margin:auto;padding:24px 16px 56px}.toolbar,.card-top,.actions{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.toolbar{margin-bottom:18px}.stamp,.hint{color:var(--muted);font-size:14px}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:14px 20px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}button:disabled{opacity:.55}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 16px #102a430d}.card{margin-bottom:14px}.card h2{margin:0;color:var(--navy);font-size:23px}.lot{font-weight:800;color:var(--blue)}.progress{height:11px;border-radius:999px;background:#e5eaf0;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:var(--blue)}label{display:block;font-weight:800;margin:18px 0 7px}input,select,textarea{width:100%;padding:15px;border:2px solid #b9c7d5;border-radius:11px;background:#fff}textarea{min-height:78px}.actions{justify-content:flex-end;margin-top:22px}.notice{display:none;margin-bottom:16px;padding:15px;border-radius:11px;background:#fee2e2;color:#991b1b;font-weight:700}.result{border-radius:16px;padding:24px;margin-top:20px;text-align:center;font-weight:900}.result strong{display:block;font-size:42px}.result.ok{background:#dcfce7;color:#166534}.result.warn{background:#fef3c7;color:#92400e}.result.bad{background:#fee2e2;color:#991b1b;border:4px solid #dc2626}.empty{text-align:center;padding:42px;color:var(--muted)}dialog{width:min(620px,calc(100% - 20px));border:0;border-radius:18px;padding:0;box-shadow:0 20px 70px #0006}dialog::backdrop{background:#0f172a99}.dialog-body{padding:24px;max-height:94vh;overflow:auto}.dialog-body h2{margin:0 0 4px}.label-sheet{width:100mm;height:150mm;overflow:hidden;border:1px solid #111;background:#fff;color:#000;padding:7mm;display:grid;grid-template-rows:auto 52mm;gap:5mm;font:13pt/1.25 Arial,sans-serif}.label-brand{height:15mm;display:flex;align-items:center}.label-brand img{display:block;max-width:72mm;max-height:13mm;filter:grayscale(1) contrast(2)}.label-product{font-size:20pt;font-weight:900;margin:3mm 0 1mm}.label-lot{font-size:16pt;font-weight:900;overflow-wrap:anywhere}.label-meta{display:grid;grid-template-columns:1fr 1fr;gap:4mm 7mm;margin-top:6mm}.label-meta span{display:block;font-size:9pt;text-transform:uppercase}.label-meta strong{font-size:14pt}.label-qr{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:9pt;overflow:hidden}.label-qr img,.label-qr canvas{width:44mm!important;height:44mm!important;display:block}.label-qr small{margin-top:1mm;font-weight:700}@media(max-width:620px){body{font-size:17px}.card-top{align-items:flex-start}.card-top button{width:100%}.actions button{flex:1}.label-sheet{width:100%;height:150mm}}@media print{@page{size:100mm 150mm;margin:0}body{margin:0}.label-sheet{border:0}}
  </style>
</head>
<body>
  <header><h1>Pesaje de piezas</h1><p>Control de peso bruto al salir del horno</p></header>
  <main>
    <div id="notice" class="notice"></div>
    <div class="toolbar"><div><strong>Órdenes abiertas</strong><div id="stamp" class="stamp">Cargando…</div></div><button class="secondary" onclick="loadOrders()">Actualizar</button></div>
    <section class="panel" style="margin-bottom:18px"><label for="operator">Operario *</label><select id="operator" required><option value="">Selecciona un operario…</option><option>Álvaro</option><option>Carlos</option><option>Emilio</option><option>Llusif</option><option>Martha</option></select></section>
    <section id="orders"><div class="empty">Cargando órdenes de fabricación…</div></section>
  </main>
  <dialog id="weightDialog"><div class="dialog-body"><h2 id="title">Pesar pieza</h2><div id="context" class="hint"></div><form onsubmit="saveWeight(event)"><input id="orderId" type="hidden"><label for="weight">Peso bruto al salir del horno (kg) *</label><input id="weight" type="number" min="0.001" step="0.001" inputmode="decimal" required><label for="notes">Observaciones</label><textarea id="notes" placeholder="Opcional"></textarea><div id="result"></div><div class="actions"><button type="button" class="secondary" onclick="closeWeight()">Cerrar</button><button id="save" class="primary" type="submit">Guardar pesaje</button></div></form></div></dialog>
  <dialog id="labelDialog"><div class="dialog-body"><h2>Vista previa de etiqueta</h2><p class="hint">Formato 100 × 150 mm. El QR abre la ficha protegida de trazabilidad del lote.</p><div id="labelSheet" class="label-sheet"></div><div class="actions"><button type="button" class="secondary" onclick="el('labelDialog').close()">Cerrar</button><button type="button" class="primary" onclick="printLabel()">Imprimir / guardar PDF</button></div></div></dialog>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const TRACEABILITY_BASE_URL='https://script.google.com/a/macros/rotoformas.com/s/AKfycbw5LAL2__An-gyUsq8qDYNKfYZ5tfJys8INv7__MpmHx32SuZWxonaFiygbsO92tBsN5Q/exec';
    const BRAND_LOGO_URL='https://cdn.durable.co/branding/1AeQu6Rux0KX6jVKtUdTlEoiwn5eOwT4hMzLYdcBnsB2kkCMATfe6YLrOibMbSrA.png';
    let data=null,lastMeasurement=null;const el=id=>document.getElementById(id);const esc=v=>String(v==null?'':v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const num=v=>new Intl.NumberFormat('es-ES',{maximumFractionDigits:2}).format(Number(v||0));const kg=v=>new Intl.NumberFormat('es-ES',{minimumFractionDigits:3,maximumFractionDigits:3}).format(Number(v||0));
    function showError(message){el('notice').textContent=message;el('notice').style.display='block';scrollTo({top:0,behavior:'smooth'})}function clearError(){el('notice').style.display='none'}
    function loadOrders(){clearError();el('orders').innerHTML='<div class="empty">Cargando órdenes de fabricación…</div>';google.script.run.withSuccessHandler(r=>{data=r;el('stamp').textContent='Actualizado: '+r.generatedAt;render()}).withFailureHandler(e=>showError(e.message||String(e))).getPlantWeightOrders()}
    function render(){const orders=data.orders;el('orders').innerHTML=orders.length?orders.map(o=>{const pct=o.targetQuantity?Math.min(100,Math.round(o.producedQuantity/o.targetQuantity*100)):0;return `<article class="card"><div class="card-top"><div><div class="lot">${esc(o.id)} · ${esc(o.finishedLot||'Lote pendiente')}</div><h2>${esc(o.sku)} · ${esc(o.product)}</h2><div class="hint">${num(o.producedQuantity)} / ${num(o.targetQuantity)} uds · Teórico ${o.theoreticalWeight?kg(o.theoreticalWeight)+' kg':'sin definir'} · ${num(o.quality.measured)} pesajes</div></div><button class="primary" onclick="openWeight('${esc(o.id)}')">Pesar pieza</button></div><div class="progress"><span style="width:${pct}%"></span></div></article>`}).join(''):'<div class="panel empty">No hay órdenes abiertas.</div>'}
    function openWeight(id){const o=data.orders.find(item=>item.id===id);const operator=el('operator').value.trim();if(!operator)return showError('Selecciona primero el operario.');clearError();el('orderId').value=id;el('weight').value='';el('notes').value='';el('result').innerHTML='';el('title').textContent='Pesar pieza · '+id;el('context').innerHTML=`<strong>${esc(o.sku)} · ${esc(o.product)}</strong><br>Lote: ${esc(o.finishedLot||'pendiente')} · Peso teórico: ${o.theoreticalWeight?kg(o.theoreticalWeight)+' kg':'sin definir'}`;el('weightDialog').showModal();setTimeout(()=>el('weight').focus(),100)}
    function closeWeight(){el('weightDialog').close();loadOrders()}
    function saveWeight(event){event.preventDefault();const button=el('save');button.disabled=true;const input={orderId:el('orderId').value,actualWeight:el('weight').value,notes:el('notes').value,operator:el('operator').value.trim()};google.script.run.withSuccessHandler(r=>{button.disabled=false;lastMeasurement=r;const cls=r.result==='CONFORME'?'ok':r.result==='ALERTA'?'warn':'bad',sign=r.difference>0?'+':'';const labelButton=r.result==='NO CONFORME'?'':`<button type="button" class="secondary" style="margin-top:14px" onclick="openLabel()">Preparar etiqueta</button>`;el('result').innerHTML=`<div class="result ${cls}"><span>Pieza ${num(r.pieceNumber)} · ${esc(r.result)}</span><strong>${kg(r.actualWeight)} kg</strong><div>Teórico ${kg(r.theoreticalWeight)} kg · ${sign}${kg(r.difference)} kg · ${num(r.deviationPercent)} %</div>${r.result==='NO CONFORME'?'<div style="margin-top:12px">⚠ APARTA LA PIEZA Y REVISA EL PROCESO</div>':labelButton}</div>`;el('weight').value='';el('weight').focus()}).withFailureHandler(e=>{button.disabled=false;showError(e.message||String(e))}).recordPlantManufacturingPieceWeight(input)}
    function openLabel(){const r=lastMeasurement;if(!r)return;const traceUrl=TRACEABILITY_BASE_URL+'?lote='+encodeURIComponent(r.finishedLot);el('labelSheet').innerHTML=`<div><div class="label-brand"><img src="${BRAND_LOGO_URL}" alt="Rotoformas"></div><div class="label-product">${esc(r.product)}</div><div>${esc(r.sku)}</div><div style="margin-top:2mm">LOTE</div><div class="label-lot">${esc(r.finishedLot)}</div><div class="label-meta"><div><span>Peso bruto</span><strong>${kg(r.actualWeight)} kg</strong></div><div><span>Pieza</span><strong>${num(r.pieceNumber)}</strong></div><div><span>Fecha</span><strong>${esc(r.measuredAt)}</strong></div><div><span>OF</span><strong>${esc(r.orderId)}</strong></div></div></div><div id="labelQr" class="label-qr" data-url="${esc(traceUrl)}"></div>`;renderLabelQr(traceUrl);el('labelDialog').showModal()}
    function renderLabelQr(url){const box=el('labelQr');if(!box)return;if(typeof QRCode==='undefined'){box.innerHTML='<strong>QR no disponible</strong>';return}new QRCode(box,{text:url,width:300,height:300,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});setTimeout(()=>{const canvas=box.querySelector('canvas'),existing=box.querySelector('img'),src=canvas?canvas.toDataURL('image/png'):existing&&existing.src;if(src)box.innerHTML=`<img src="${src}" alt="QR de trazabilidad"><small>Escanear trazabilidad</small>`},80)}
    function printLabel(){const sheet=el('labelSheet');if(!sheet.innerHTML)return;const popup=window.open('','_blank','width=760,height=900');if(!popup){showError('El navegador ha bloqueado la ventana de impresión. Permite las ventanas emergentes para esta página.');return}popup.document.open();popup.document.write(`<!doctype html><html><head><title>Etiqueta ${esc(lastMeasurement&&lastMeasurement.finishedLot)}</title><style>*{box-sizing:border-box}@page{size:100mm 150mm;margin:0}body{margin:0;background:#fff}.label-sheet{width:100mm;height:150mm;overflow:hidden;background:#fff;color:#000;padding:7mm;display:grid;grid-template-rows:auto 52mm;gap:5mm;font:13pt/1.25 Arial,sans-serif}.label-brand{height:15mm;display:flex;align-items:center}.label-brand img{display:block;max-width:72mm;max-height:13mm;filter:grayscale(1) contrast(2)}.label-product{font-size:20pt;font-weight:900;margin:3mm 0 1mm}.label-lot{font-size:16pt;font-weight:900;overflow-wrap:anywhere}.label-meta{display:grid;grid-template-columns:1fr 1fr;gap:4mm 7mm;margin-top:6mm}.label-meta span{display:block;font-size:9pt;text-transform:uppercase}.label-meta strong{font-size:14pt}.label-qr{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:9pt;overflow:hidden}.label-qr img{width:44mm;height:44mm;display:block}.label-qr small{margin-top:1mm;font-weight:700}</style></head><body>${sheet.outerHTML}<script>window.addEventListener('load',()=>{window.focus();window.print()});<\/script></body></html>`);popup.document.close()}
    loadOrders();
  </script>
</body>
</html>
