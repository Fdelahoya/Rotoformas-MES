<!doctype html>
<html lang="es">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --navy:#102a43; --blue:#2563eb; --pale:#eff6ff; --line:#dbe4ee; --muted:#62748a; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f5f7fa; color:#17212b; font:15px/1.45 Arial,sans-serif; }
    header { background:linear-gradient(120deg,var(--navy),#164e63); color:white; padding:24px clamp(18px,4vw,48px); }
    header h1 { margin:0 0 4px; font-size:clamp(24px,4vw,36px); }
    header p { margin:0; opacity:.82; }
    main { max-width:1200px; margin:auto; padding:24px clamp(14px,3vw,32px) 48px; }
    .toolbar { display:flex; gap:12px; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
    button, select, input { font:inherit; }
    button { border:0; border-radius:9px; padding:10px 15px; cursor:pointer; font-weight:700; }
    button.primary { background:var(--blue); color:white; }
    button.secondary { background:white; color:var(--navy); border:1px solid var(--line); }
    button:disabled { opacity:.55; cursor:wait; }
    .timestamp { color:var(--muted); font-size:13px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; }
    .card { background:white; border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:0 4px 14px rgba(16,42,67,.06); }
    .card-top { display:flex; justify-content:space-between; gap:10px; align-items:start; }
    .card h2 { font-size:18px; margin:0; color:var(--navy); }
    .product { color:var(--muted); min-height:22px; margin:2px 0 15px; }
    .badge { border-radius:999px; padding:4px 9px; font-size:11px; font-weight:800; white-space:nowrap; background:#fef3c7; color:var(--warn); }
    .badge.ok { background:#dcfce7; color:var(--ok); }
    .badge.bad { background:#fee2e2; color:var(--bad); }
    .lot { font-size:22px; font-weight:800; margin:5px 0; }
    .stock { color:var(--ok); font-size:18px; font-weight:700; }
    .meta { color:var(--muted); font-size:12px; margin:10px 0 16px; min-height:36px; }
    .empty { color:var(--warn); margin:10px 0 20px; }
    section.history { margin-top:28px; background:white; border:1px solid var(--line); border-radius:14px; padding:18px; overflow:auto; }
    table { width:100%; border-collapse:collapse; min-width:700px; }
    th,td { text-align:left; padding:10px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-size:12px; text-transform:uppercase; }
    dialog { width:min(520px,calc(100% - 24px)); border:0; border-radius:16px; padding:0; box-shadow:0 20px 70px rgba(0,0,0,.28); }
    dialog::backdrop { background:rgba(15,23,42,.55); }
    .dialog-body { padding:22px; }
    .dialog-body h2 { margin-top:0; }
    label { display:block; font-weight:700; margin:14px 0 6px; }
    select,input { width:100%; padding:11px; border:1px solid #b9c7d5; border-radius:8px; background:white; }
    .hint { color:var(--muted); font-size:13px; }
    .actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
    .notice { display:none; margin-bottom:16px; padding:12px 15px; border-radius:9px; background:#dcfce7; color:#166534; }
    .notice.error { background:#fee2e2; color:#991b1b; }
    .loading { padding:40px; text-align:center; color:var(--muted); }
  </style>
</head>
<body>
  <header><h1>Lotes activos</h1><p>Rotoformas MES · Materias primas en producción</p></header>
  <main>
    <div id="notice" class="notice"></div>
    <div class="toolbar">
      <div id="timestamp" class="timestamp">Cargando datos de Holded…</div>
      <button id="refresh" class="secondary" onclick="loadDashboard()">Actualizar</button>
    </div>
    <div id="cards" class="cards"><div class="loading">Consultando productos y lotes…</div></div>
    <section class="history">
      <h2>Últimos cambios</h2>
      <div id="history" class="hint">Todavía no hay cambios registrados.</div>
    </section>
  </main>

  <dialog id="lotDialog">
    <div class="dialog-body">
      <h2 id="dialogTitle">Cambiar lote activo</h2>
      <p class="hint">Escanea el código con la pistola lectora o selecciona un lote disponible.</p>
      <label for="scan">Código escaneado</label>
      <input id="scan" autocomplete="off" placeholder="Código de barras o nombre del lote">
      <label for="lotSelect">Lotes de Holded</label>
      <select id="lotSelect"><option value="">Selecciona un lote…</option></select>
      <div class="actions">
        <button class="secondary" onclick="closeDialog()">Cancelar</button>
        <button id="activate" class="primary" onclick="activateLot()">Activar lote</button>
      </div>
    </div>
  </dialog>

  <script>
    let dashboard = null;
    let selectedSku = "";

    function escapeHtml(value) {
      return String(value == null ? "" : value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }
    function formatStock(value) {
      return new Intl.NumberFormat('es-ES', {maximumFractionDigits:3}).format(Number(value || 0));
    }
    function showNotice(message, error) {
      const node = document.getElementById('notice');
      node.textContent = message;
      node.className = 'notice' + (error ? ' error' : '');
      node.style.display = 'block';
      window.scrollTo({top:0, behavior:'smooth'});
    }
    function loadDashboard() {
      const button = document.getElementById('refresh');
      button.disabled = true;
      google.script.run
        .withSuccessHandler(data => { dashboard = data; render(); button.disabled = false; })
        .withFailureHandler(error => { showNotice(error.message || String(error), true); button.disabled = false; })
        .getLotsDashboardData();
    }
    function render() {
      document.getElementById('timestamp').textContent = 'Actualizado: ' + dashboard.generatedAt;
      document.getElementById('cards').innerHTML = dashboard.materials.map(material => {
        const active = material.active;
        const badgeClass = !material.found || (active && !active.valid) ? 'bad' : active ? 'ok' : '';
        const badgeText = !material.found ? 'NO ENCONTRADO' : active && !active.valid ? 'LOTE NO VÁLIDO' : active ? 'ACTIVO' : 'SIN CONFIGURAR';
        return `<article class="card">
          <div class="card-top"><h2>${escapeHtml(material.sku)}</h2><span class="badge ${badgeClass}">${badgeText}</span></div>
          <div class="product">${escapeHtml(material.productName || 'No localizado en Holded')}</div>
          ${active ? `<div class="lot">${escapeHtml(active.lotName)}</div><div class="stock">${formatStock(active.stock)} ${material.sku === 'INSERTO V4' ? 'uds' : 'kg'}</div><div class="meta">Código: ${escapeHtml(active.barcode || '—')}<br>Cambio: ${escapeHtml(active.changedAt)} · ${escapeHtml(active.changedBy)}</div>` : `<div class="empty">No hay ningún lote activo seleccionado.</div>`}
          <button class="primary" ${material.found && material.lots.length ? '' : 'disabled'} onclick="openDialog('${escapeHtml(material.sku)}')">Cambiar lote</button>
        </article>`;
      }).join('');
      const history = dashboard.history;
      document.getElementById('history').innerHTML = history.length ? `<table><thead><tr><th>Fecha</th><th>Materia prima</th><th>Lote anterior</th><th>Lote nuevo</th><th>Stock</th><th>Operario</th></tr></thead><tbody>${history.map(item => `<tr><td>${escapeHtml(item.changedAt)}</td><td>${escapeHtml(item.sku)}</td><td>${escapeHtml(item.previousLot || '—')}</td><td>${escapeHtml(item.newLot)}</td><td>${formatStock(item.stock)}</td><td>${escapeHtml(item.changedBy)}</td></tr>`).join('')}</tbody></table>` : 'Todavía no hay cambios registrados.';
    }
    function openDialog(sku) {
      selectedSku = sku;
      const material = dashboard.materials.find(item => item.sku === sku);
      document.getElementById('dialogTitle').textContent = 'Cambiar lote · ' + sku;
      document.getElementById('scan').value = '';
      document.getElementById('lotSelect').innerHTML = '<option value="">Selecciona un lote…</option>' + material.lots.map(lot => `<option value="${escapeHtml(lot.id)}">${escapeHtml(lot.name)} · ${formatStock(lot.stock)} ${sku === 'INSERTO V4' ? 'uds' : 'kg'}${lot.barcode ? ' · ' + escapeHtml(lot.barcode) : ''}</option>`).join('');
      document.getElementById('lotDialog').showModal();
      setTimeout(() => document.getElementById('scan').focus(), 100);
    }
    function closeDialog() { document.getElementById('lotDialog').close(); }
    function activateLot() {
      const scan = document.getElementById('scan').value.trim();
      const selected = document.getElementById('lotSelect').value;
      const reference = scan || selected;
      if (!reference) return showNotice('Escanea o selecciona un lote.', true);
      const button = document.getElementById('activate');
      button.disabled = true;
      google.script.run
        .withSuccessHandler(result => {
          closeDialog();
          showNotice(`${result.sku}: lote ${result.lotName} activado correctamente.`, false);
          button.disabled = false;
          loadDashboard();
        })
        .withFailureHandler(error => { showNotice(error.message || String(error), true); button.disabled = false; })
        .activateProductionLot(selectedSku, reference);
    }
    document.getElementById('scan').addEventListener('keydown', event => {
      if (event.key === 'Enter') { event.preventDefault(); activateLot(); }
    });
    loadDashboard();
  </script>
</body>
</html>
